name: Daily league update

on:
  schedule:
    # GitHub schedules run in UTC. Two entries cover 2:00 AM Central in both
    # daylight time (07:00 UTC) and standard time (08:00 UTC); the "gate" step
    # below skips whichever one isn't 2 AM right now.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
    # Sunday evening, 8 PM and 11 PM Central (Monday in UTC): extra snapshots of the
    # week's lineups while it's still live, so Sunday's locks are seen before Sleeper
    # closes the week (assets/weekfix.js). Same gate as above.
    - cron: '0 1 * * 1'
    - cron: '0 2 * * 1'
    - cron: '0 4 * * 1'
    - cron: '0 5 * * 1'
  workflow_dispatch: # adds the "Run workflow" button on the Actions tab
  push:
    branches: [main] # redeploy whenever you upload changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Only run at 2 AM Central (and Sunday 8 PM / 11 PM)
        id: gate
        run: |
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            OFFSET=$(TZ=America/Chicago date +%z)   # -0500 in summer, -0600 in winter
            case "${{ github.event.schedule }}" in
              "0 7 * * *"|"0 1 * * 1"|"0 4 * * 1") [ "$OFFSET" = "-0500" ] || RUN=false ;;
              "0 8 * * *"|"0 2 * * 1"|"0 5 * * 1") [ "$OFFSET" = "-0600" ] || RUN=false ;;
            esac
            # GitHub starts these schedules hours late, so the game-day watcher (lgs.yml) starts this update at
            # 2 AM / Sunday 8 PM / 11 PM sharp and records it in data/nightly.json. Skip a late copy it already ran.
            DONE=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/main/data/nightly.json?t=$(date +%s)")
            case "${{ github.event.schedule }}" in
              "0 7 * * *"|"0 8 * * *")
                DAY=$(TZ=America/Chicago date -d '12 hours ago' +%F)
                echo "$DONE" | grep -q "\"day\":\"$DAY\"" && { echo "Tonight's update already ran at 2 AM."; RUN=false; } ;;
              *)
                SUN=$(TZ=America/Chicago date -d '6 hours ago' +%F)
                echo "$DONE" | grep -q "\"sunday\":\"$SUN\"" && { echo "Sunday's snapshots already ran on time."; RUN=false; } ;;
            esac
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Pull league data from Sleeper
        if: steps.gate.outputs.run == 'true'
        run: node scripts/update.mjs

      - name: Save data to the repo
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily league update $(TZ=America/Chicago date +%F)"
          # If an upload or another run landed while this ran (e.g. two commits a
          # few seconds apart), put this data commit on top and try again. When
          # both runs saved the same data files, keep this run's copy: it's the
          # same league data, just pulled a few seconds later.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "The repo changed during this run; catching up and retrying ($attempt)."
            git pull --rebase --autostash -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          git push

      # Tag the site's files with a fingerprint of the assets folder, so browsers
      # load new copies right after an upload instead of cached ones. Only the
      # published copy is changed; index.html in the repo keeps "v=dev".
      - name: Stamp file versions
        if: steps.gate.outputs.run == 'true'
        run: |
          VERSION=$(git rev-parse --short HEAD:assets)
          sed -i "s/?v=dev/?v=$VERSION/g" index.html
          echo "Site files tagged v=$VERSION"

      - uses: actions/configure-pages@v6
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.gate.outputs.run == 'true'
        with:
          path: .

      - id: deploy
        if: steps.gate.outputs.run == 'true'
        uses: actions/deploy-pages@v5

      # Runs after the site is published, so a mismatch never blocks the update.
      # Failing here marks the run with a red X, and GitHub emails you about it.
      - name: Scoring check
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -s data/scoring-check.txt ]; then
            cat data/scoring-check.txt
            exit 1
          fi
          echo "Every weekly score matches Sleeper's official standings."
